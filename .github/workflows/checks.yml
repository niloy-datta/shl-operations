name: Checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Check public preview scripts
        run: node --check ../../docs/demo/demo.js && node --check ../../docs/demo/enterprise.js
      - run: npm run build
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
        env:
          SESSION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: mvn -B verify
        env:
          MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery scripts
        run: bash -n scripts/backup-local.sh scripts/restore-drill-local.sh
      - name: Unit-test deployment preflight
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate isolated production Compose topology
        env:
          SHL_DOMAIN: staging.example.org
          POSTGRES_DB: shl_operations
          POSTGRES_USER: shl_app
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          BOOTSTRAP_ADMIN_USERNAME: ci_operator
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-bootstrap-credential
          MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: docker compose -f compose.prod.yaml config --quiet
