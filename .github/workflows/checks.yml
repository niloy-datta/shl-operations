name: Checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Check public preview scripts
        run: node --check ../../docs/demo/demo.js && node --check ../../docs/demo/enterprise.js
      - run: npm run build
        env:
          SESSION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - run: mvn -B verify
        env:
          MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recovery scripts
        run: bash -n scripts/backup-local.sh scripts/restore-drill-local.sh scripts/predeploy-check.sh scripts/backup-encrypted-offsite.sh scripts/restore-encrypted-drill.sh
      - name: Validate isolated staging topology (synthetic env)
        env:
          SHL_STAGING_DOMAIN: staging.example.test
          POSTGRES_DB: shl_staging
          POSTGRES_USER: shl_staging_app
          POSTGRES_PASSWORD: synthetic-only-sample-password-not-real
          BOOTSTRAP_ADMIN_USERNAME: staging_admin
          BOOTSTRAP_ADMIN_PASSWORD: synthetic-only-separate-password-not-real
          MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          docker compose -f compose.staging.yaml config --format json | python3 -c '
          import json,sys
          cfg=json.load(sys.stdin)["services"]
          assert not cfg["db"].get("ports"), "Database must not publish ports"
          assert not cfg["api"].get("ports"), "API must not publish ports"
          assert not cfg["web"].get("ports"), "Web must not publish ports"
          assert cfg["api"]["environment"]["MFA_ENFORCEMENT_ENABLED"] == "true"
          assert cfg["api"]["environment"]["SHL_DEPLOYMENT_MODE"] == "development"
          assert cfg["web"]["environment"]["SHL_PUBLIC_ORIGIN"] == "https://staging.example.test"
          assert cfg["api"]["environment"]["SHL_WEBSITE_INTAKE_SECRET"] == ""
          assert cfg["api"]["environment"]["COMMISSION_AUTHORIZED_USERS"] == ""
          '

  api-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Protect applied Flyway history
        run: |
          git diff --name-only a9eb334 HEAD -- apps/api/src/main/resources/db/migration | python3 -c '
          import re, sys
          changed = [s.strip() for s in sys.stdin if re.search(r"/V(?:[1-9]|1[0-9]|2[0-7])__", s)]
          if changed:
              print("Applied migrations changed:", *changed, sep="\n")
              sys.exit(1)
          '
