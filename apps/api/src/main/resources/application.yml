spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${API_BIND_ADDRESS:127.0.0.1}
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
northstar:
  auth:
    issuer: ${SUPABASE_URL}/auth/v1
    jwks-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
    mode: ${SUPABASE_JWT_MODE:jwks}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
